name: ThemeForest clean demo extractor

on:
  pull_request:
    paths:
      - '.github/workflows/themeforest-clean.yml'
      - 'scripts/themeforest_clean_v2.py'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install httpx beautifulsoup4 lxml
      - name: Extract clean demo pages
        run: python scripts/themeforest_clean_v2.py output 1000
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themeforest-clean-demo-pages-v2
          path: output/
          retention-days: 3
