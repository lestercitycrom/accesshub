name: ThemeForest clean demo extractor

on:
  pull_request:
    paths:
      - '.github/workflows/themeforest-clean.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test public search fallbacks
        shell: bash
        run: |
          mkdir -p output
          set +e
          QUERIES=(
            'Canvas multipurpose HTML5 template SemicolonWeb live demo'
            'Porto responsive HTML5 template Okler live demo'
            'MegaOne one page parallax template live demo'
            'Limitless responsive web application kit live demo'
          )
          i=0
          for query in "${QUERIES[@]}"; do
            encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote_plus(sys.argv[1]))' "$query")
            curl -L --max-time 45 -A 'Mozilla/5.0' \
              "https://html.duckduckgo.com/html/?q=$encoded" \
              -o "output/ddg-$i.html"
            curl -L --max-time 45 -A 'Mozilla/5.0' \
              "https://www.bing.com/search?q=$encoded" \
              -o "output/bing-$i.html"
            curl -L --max-time 45 \
              "https://r.jina.ai/https://www.google.com/search?q=$encoded" \
              -o "output/google-jina-$i.txt"
            i=$((i+1))
          done
          wc -c output/* | tee output/sizes.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themeforest-search-fallback-test
          path: output/
          retention-days: 3
