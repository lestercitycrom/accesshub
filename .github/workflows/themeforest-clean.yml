name: ThemeForest clean demo extractor

on:
  pull_request:
    paths:
      - '.github/workflows/themeforest-clean.yml'
      - 'scripts/themeforest_description_extract.py'
  workflow_dispatch:

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        start: [0, 250, 500, 750]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install httpx beautifulsoup4 lxml
      - name: Restore saved ranking
        shell: bash
        run: |
          mkdir -p output
          INPUT_PARTS=(
            data/themeforest_previews.json.gz.b64.part00
            data/themeforest_previews.json.gz.b64.part01
            data/themeforest_previews.part02.00
            data/themeforest_previews.part02.01
            data/themeforest_previews.part02.02
            data/themeforest_previews.part02.03
            data/themeforest_previews.part02.04
            data/themeforest_previews.json.gz.b64.part03
            data/themeforest_previews.json.gz.b64.part04
            data/themeforest_previews.json.gz.b64.part05
          )
          cat "${INPUT_PARTS[@]}" > /tmp/themeforest-input.b64
          echo 'f546027dd39e0efa9c3c192784640b7d3a3e6304a99044e37ae4be95ff34a95e  /tmp/themeforest-input.b64' | sha256sum --check
          base64 --decode /tmp/themeforest-input.b64 | gzip --decompress > data/themeforest-previews-runtime.json
          echo '20e01ced93846ae4336c8f5f5b4581e706a4ff582fffbf9817f54240398d28cd  data/themeforest-previews-runtime.json' | sha256sum --check
      - name: Extract description links
        shell: bash
        run: |
          set -o pipefail
          python scripts/themeforest_description_extract.py \
            data/themeforest-previews-runtime.json output ${{ matrix.start }} 250 \
            2>&1 | tee output/extractor.log
      - name: Upload chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themeforest-desc-${{ matrix.start }}
          path: output/
          retention-days: 3

  merge:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: themeforest-desc-*
          path: chunks
      - name: Merge description pass
        shell: bash
        run: |
          mkdir -p final
          python - <<'PY'
          import csv, glob, json
          from pathlib import Path
          paths = glob.glob('chunks/**/themeforest-clean-demo-pages.json', recursive=True)
          rows = []
          for path in paths:
              rows.extend(json.load(open(path, encoding='utf-8')))
          rows.sort(key=lambda row: int(row['rank']))
          if len(rows) != 1000:
              raise SystemExit(f'Expected 1000 rows, got {len(rows)} from {len(paths)} chunks')
          if len({int(row['item_id']) for row in rows}) != 1000:
              raise SystemExit('Duplicate item IDs in merged result')
          fields = list(rows[0].keys())
          Path('final/themeforest-description-pass-1000.json').write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          with open('final/themeforest-description-pass-1000.csv', 'w', encoding='utf-8-sig', newline='') as file:
              writer = csv.DictWriter(file, fieldnames=fields)
              writer.writeheader(); writer.writerows(rows)
          verified = [row for row in rows if row.get('clean_demo_url') and row.get('confidence') in ('high','medium') and int(row.get('http_status') or 0) < 400]
          unresolved = [row for row in rows if row not in verified]
          Path('final/themeforest-description-verified.txt').write_text(
              '\n'.join(row['clean_demo_url'] for row in verified) + ('\n' if verified else ''), encoding='utf-8'
          )
          with open('final/themeforest-description-unresolved.csv', 'w', encoding='utf-8-sig', newline='') as file:
              writer = csv.DictWriter(file, fieldnames=fields)
              writer.writeheader(); writer.writerows(unresolved)
          summary = {
              'total': len(rows),
              'verified': len(verified),
              'unresolved': len(unresolved),
              'high': sum(row.get('confidence') == 'high' for row in rows),
              'medium': sum(row.get('confidence') == 'medium' for row in rows),
              'item_pages_read': sum(bool(row.get('item_page_status')) for row in rows),
              'errors': sum(bool(row.get('error')) for row in rows),
          }
          Path('final/summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload merged description pass
        uses: actions/upload-artifact@v4
        with:
          name: themeforest-description-pass-1000
          path: final/
          retention-days: 3
