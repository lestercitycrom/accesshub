name: ThemeForest clean demo extractor

on:
  pull_request:
    paths:
      - '.github/workflows/themeforest-clean.yml'
      - 'scripts/themeforest_search_unresolved.py'
      - 'scripts/themeforest_search_unresolved_v2.py'
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        start: [0, 250, 500, 750]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install httpx beautifulsoup4 lxml
      - name: Download description pass
        uses: actions/download-artifact@v4
        with:
          name: themeforest-description-pass-1000
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 29299069474
      - name: Prepare chunk
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          start = ${{ matrix.start }}
          rows = json.load(open('input/themeforest-description-pass-1000.json', encoding='utf-8'))
          chunk = rows[start:start + 250]
          if len(chunk) != 250:
              raise SystemExit(f'Expected 250 rows, got {len(chunk)}')
          Path('input/chunk.json').write_text(json.dumps(chunk, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Search unresolved and suspicious rows
        shell: bash
        run: |
          set -o pipefail
          python scripts/themeforest_search_unresolved_v2.py \
            input/chunk.json output \
            2>&1 | tee output/search.log
      - name: Upload searched chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themeforest-search-${{ matrix.start }}
          path: output/
          retention-days: 3

  merge:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: themeforest-search-*
          path: chunks
      - name: Merge final results
        shell: bash
        run: |
          mkdir -p final
          python - <<'PY'
          import csv, glob, hashlib, json, re, zipfile
          from pathlib import Path
          paths = glob.glob('chunks/**/themeforest-clean-demo-pages.json', recursive=True)
          rows = []
          for path in paths:
              rows.extend(json.load(open(path, encoding='utf-8')))
          rows.sort(key=lambda row: int(row['rank']))
          if len(rows) != 1000:
              raise SystemExit(f'Expected 1000 rows, got {len(rows)} from {len(paths)} chunks')
          if len({int(row['item_id']) for row in rows}) != 1000:
              raise SystemExit('Duplicate item IDs in final result')

          suspicious = re.compile(r'/(?:auth|sign[-_]?in|login|register|reviews?|builder|forums?|faqs?|support|docs?|documentation|changelog|blog|article|post|single|product|shop|cart|checkout|portfolio-item)(?:[/.\-_]|$)', re.I)
          verified = []
          for row in rows:
              url = row.get('clean_demo_url', '')
              if not url or row.get('confidence') not in ('high', 'medium'):
                  continue
              if int(row.get('http_status') or 0) >= 400:
                  continue
              if suspicious.search(url):
                  continue
              verified.append(row)
          unresolved = [row for row in rows if row not in verified]

          fields = list(rows[0].keys())
          json_path = Path('final/themeforest-clean-demo-pages-1000.json')
          csv_path = Path('final/themeforest-clean-demo-pages-1000.csv')
          txt_path = Path('final/themeforest-clean-demo-pages-verified.txt')
          review_path = Path('final/themeforest-needs-review.csv')
          summary_path = Path('final/summary.json')
          checksum_path = Path('final/SHA256SUMS.txt')
          zip_path = Path('final/themeforest-clean-demo-pages.zip')

          json_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with csv_path.open('w', encoding='utf-8-sig', newline='') as file:
              writer = csv.DictWriter(file, fieldnames=fields)
              writer.writeheader(); writer.writerows(rows)
          txt_path.write_text('\n'.join(row['clean_demo_url'] for row in verified) + ('\n' if verified else ''), encoding='utf-8')
          with review_path.open('w', encoding='utf-8-sig', newline='') as file:
              writer = csv.DictWriter(file, fieldnames=fields)
              writer.writeheader(); writer.writerows(unresolved)

          urls = [row['clean_demo_url'] for row in verified]
          summary = {
              'total_products': len(rows),
              'verified_clean_demo_urls': len(verified),
              'unresolved_or_rejected': len(unresolved),
              'unique_verified_urls': len(set(urls)),
              'high_confidence': sum(row.get('confidence') == 'high' for row in verified),
              'medium_confidence': sum(row.get('confidence') == 'medium' for row in verified),
              'search_resolved': sum('search-pass' in row.get('candidate_method','') for row in verified),
              'description_resolved': sum('description-only' in row.get('candidate_method','') for row in verified),
              'rows_with_errors': sum(bool(row.get('error')) for row in rows),
          }
          summary_path.write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')

          files = [json_path, csv_path, txt_path, review_path, summary_path]
          checksum_path.write_text('\n'.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}' for path in files) + '\n', encoding='utf-8')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in files + [checksum_path]:
                  archive.write(path, path.name)
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: themeforest-clean-demo-pages-final
          path: final/
          retention-days: 3
