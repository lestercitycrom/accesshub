name: ThemeForest clean demo extractor

on:
  pull_request:
    paths:
      - '.github/workflows/themeforest-clean.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test item-page readers
        shell: bash
        run: |
          mkdir -p output
          set +e
          curl -L --max-time 60 -D output/multikart-jina-https.headers \
            'https://r.jina.ai/https://themeforest.net/item/multikart-responsive-ecommerce-html-template/22809967' \
            -o output/multikart-jina-https.txt
          curl -L --max-time 60 -D output/metronic-jina-https.headers \
            'https://r.jina.ai/https://themeforest.net/item/metronic-responsive-admin-dashboard-template/4021469' \
            -o output/metronic-jina-https.txt
          curl -L --max-time 60 -D output/multikart-jina-http.headers \
            'https://r.jina.ai/http://themeforest.net/item/multikart-responsive-ecommerce-html-template/22809967' \
            -o output/multikart-jina-http.txt
          curl -L --max-time 60 -D output/envato-api.headers \
            'https://api.envato.com/v3/market/catalog/item?id=22809967' \
            -o output/envato-api.json
          wc -c output/* | tee output/sizes.txt
          grep -Eoi 'https?://[^ )"<>]+' output/multikart-jina-https.txt \
            | head -100 > output/multikart-links.txt
          grep -Eoi 'https?://[^ )"<>]+' output/metronic-jina-https.txt \
            | head -100 > output/metronic-links.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themeforest-item-reader-test
          path: output/
          retention-days: 3
